[package]
name = "test_generator"
default-run = "test_generator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arduinox86_client = { path = "../arduinox86_client", features = ["use_moo", "use_iced"] }
marty_dasm = { git = "https://github.com/dbalsom/marty_dasm" }
marty_isadb = { git = "https://github.com/dbalsom/marty_dasm" }
log.workspace = true
env_logger.workspace = true
clap = { workspace = true, features = ["derive"] }
toml = { workspace = true }
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
rand.workspace = true
rand_distr.workspace = true
iced-x86.workspace = true
indexmap.workspace = true
moo-rs.workspace = true
strum.workspace = true
strum_macros.workspace = true
time = { version = "0.3", features = ["macros", "formatting", "local-offset"] }

[dev-dependencies]
tempfile.workspace = true
