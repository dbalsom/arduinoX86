[package]
name = "arduinox86_egui"
version = "0.1.0"
authors = ["Daniel Balsom"]
edition = "2021"
include = ["LICENSE", "**/*.rs", "Cargo.toml"]
rust-version = "1.81"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[dependencies]
egui = "0.32"
eframe = { version = "0.32", default-features = false, features = [
    "accesskit", # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts", # Embed the default egui fonts.
    "glow", # Use the glow rendering backend. Alternative: "wgpu".
    "persistence", # Enable restoring app state when restarting the app.
    "wayland", # To support Linux (and CI)
] }
egui_extras = { version = "0.32", default-features = false, features = ["serde", "syntect"] }
egui-notify = "0.20"
syntect = { version = "5", default-features = false }
log = "0.4"
wgpu = "25"
toml.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
tempfile.workspace = true
uuid.workspace = true
serde = { version = "1", features = ["derive"] }
env_logger = "0.11"
serialport = "4.2"
anyhow = "1.0"
strum = "0.26"
strum_macros = "0.26"
pollster.workspace = true
crossbeam-channel.workspace = true
egui-phosphor.workspace = true

# internal crate dependencies
arduinox86_client = { path = "../arduinox86_client" }
marty_dasm.workspace = true
clap = { version = "4.5.37", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
